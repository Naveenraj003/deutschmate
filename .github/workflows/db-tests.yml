name: Database Tests & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run pgTAP & RLS Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Run Database Tests
        run: supabase test db

      - name: Verify working tree under supabase/ is clean
        run: |
          if [ -n "$(git status --porcelain supabase/)" ]; then
            echo "Error: Working tree under supabase/ has uncommitted modifications:"
            git status --porcelain supabase/
            exit 1
          fi
